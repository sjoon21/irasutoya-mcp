[project]
name = "irasutoya-mcp"
version = "0.1.0"
description = "Search and download irasutoya illustrations via MCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["integration: hits irasutoya.com over the network"]

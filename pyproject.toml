[project]
name = "irasutoya-mcp"
version = "0.1.0"
description = "Search and download irasutoya illustrations via MCP"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.11",
    "httpx>=0.28.1",
]

[project.scripts]
irasutoya-mcp = "irasutoya_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["irasutoya_mcp.py"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["integration: hits irasutoya.com over the network"]
